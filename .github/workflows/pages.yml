name: Publish prototype to GitHub Pages
# Static demo deployment from the prototype directory.

on:
  push:
    branches:
      - main
      - codex/music-production-studio-20260727
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload prototype artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototype

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
