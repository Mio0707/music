name: Publish prototype to GitHub Pages

on:
  push:
    branches:
      - codex/music-production-studio-20260727
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prototype

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
