<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古诗完成页 UI 对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; color: #293042; background: #edeae5; font-family: "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 18px; text-align: center; font-size: 24px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    figure { margin: 0; overflow: hidden; border-radius: 22px; background: white; box-shadow: 0 12px 32px rgba(40,36,32,.12); }
    figcaption { padding: 13px 16px; font-size: 16px; font-weight: 800; }
    img { display: block; width: 100%; height: 680px; object-fit: contain; object-position: top center; background: #fff9f0; }
  </style>
</head>
<body>
  <h1>古诗完成页：原问题与修正结果</h1>
  <main>
    <figure><figcaption>原页面：角色遮挡、舞台空白过多</figcaption><img src="qa-source-poem-success-ui.png" alt="原页面"></figure>
    <figure><figcaption>修正后：主唱与乐队分区，并显示 2＋4＋2 时间轴</figcaption><img src="qa-poem-success-final.png" alt="修正后的页面"></figure>
  </main>
</body>
</html>
