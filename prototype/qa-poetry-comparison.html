<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>创作完成页视觉对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #172033; color: white; font: 16px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 18px; font-size: 24px; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    figure { margin: 0; padding: 14px; border-radius: 16px; background: #263149; }
    figcaption { margin-bottom: 10px; font-weight: 800; }
    img { display: block; width: 100%; height: auto; border-radius: 10px; background: white; }
  </style>
</head>
<body>
  <h1>创作第 3 步：原页面与新产品逻辑并排对照</h1>
  <div class="compare">
    <figure><figcaption>原页面视觉语言</figcaption><img src="qa-source-old-refine.png" alt="原创作完成页"></figure>
    <figure><figcaption>新页面：选择古诗并合成人声</figcaption><img src="qa-poetry-finish.png" alt="新古诗匹配完成页"></figure>
  </div>
</body>
</html>
