<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>合作表演视觉对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #172033; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 18px; font-size: 24px; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    figure { margin: 0; padding: 14px; border-radius: 16px; background: #263149; }
    figcaption { margin-bottom: 10px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <h1>角色选择页：设计稿与真实页面并排对照</h1>
  <div class="compare">
    <figure>
      <figcaption>设计目标</figcaption>
      <img src="qa-source-role-selection.png" alt="角色选择设计稿">
    </figure>
    <figure>
      <figcaption>浏览器真实实现</figcaption>
      <img src="qa-role-selection-viewport.png" alt="角色选择真实页面">
    </figure>
  </div>
</body>
</html>
