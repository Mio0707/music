<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>合作练习修改前后对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #273047; background: #eef1f5; font-family: Arial, "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 20px; font-size: 26px; }
    section { margin-bottom: 28px; padding: 18px; border-radius: 18px; background: white; box-shadow: 0 8px 24px rgba(39,48,71,.08); }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; color: #687087; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border: 1px solid #d9dde6; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>合作练习页面：修改前后</h1>
  <section>
    <h2>身体节奏</h2>
    <div class="pair">
      <figure><figcaption>修改前</figcaption><img src="qa-body-practice-viewport.png" alt="修改前身体节奏页面"></figure>
      <figure><figcaption>修改后</figcaption><img src="qa-body-practice-final.png" alt="修改后身体节奏页面"></figure>
    </div>
  </section>
  <section>
    <h2>旋律手势</h2>
    <div class="pair">
      <figure><figcaption>修改前</figcaption><img src="qa-melody-practice.png" alt="修改前旋律手势页面"></figure>
      <figure><figcaption>修改后</figcaption><img src="qa-melody-practice-final.png" alt="修改后旋律手势页面"></figure>
    </div>
  </section>
</body>
</html>
